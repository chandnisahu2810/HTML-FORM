<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form-College Registration</title>
    <link rel="stylesheet" href="style4.css" </head>

<body>
    <!-- This is a form -->
    <form>
        <h1>Registration Form 2026</h1>
        <h2>MKVY College Of Enginnering, Indore</h2>
        <label>Full Name:</label><br>
        <input type="text" placeholder="Entre your name"><br><br>
        <label>Gender:</label><br>
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Femail<br><br>
        <label>Date Of Birth</label><br>
        <input type="date" placeholder=""><br><br>
        <label>semester:</label><br>
        <input type="text" placeholder="Entre your semester"><br><br>
        <label>Course:</label><br>
        <input type="text" placeholder="Entre your course"><br><br>
        <label>Email Address:</label><br>
        <input type="text" placeholder="Entre your email"><br><br>
        <label>Passward:</label><br>
        <input type="password" placeholder="Entre your password"><br><br>
        <label>Mobile Number:</label><br>
        <input type="number" placeholder="Entre your number"><br><br>
        <label>Do you have these documents:</label><br>
        <input type="checkbox">Pan card<br>
        <input type="checkbox">Bank account<br>
        <input type="checkbox">Adhar card<br>
        <input type="checkbox">Student Id<br>
        <input type="checkbox">Voter Id<br><br>
        <label>Category:</label><br>
        <input type="radio" name="Category">Genral<br>
        <input type="radio" name="Category">OBC<br>
        <input type="radio" name="Category">St/Sc<br><br>
        <button>Submit</button>
    </form>

</body>

</html>
